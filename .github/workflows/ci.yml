name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-guard:
    name: Data guard (no UF validation data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for forbidden files
        run: python scripts/check_forbidden.py

  game:
    name: Game (lint, test, build, a11y)
    needs: data-guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # TODO: switch to `npm ci` once game/package-lock.json is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint (ESLint + jsx-a11y)
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build (tsc + Vite)
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Accessibility check (axe, serious/critical = fail)
        run: npm run test:a11y
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: game/playwright-report
          if-no-files-found: ignore

  pipeline:
    name: Pipeline (Python ${{ matrix.python-version }})
    needs: data-guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pipeline
        run: python -m pip install -e "./pipeline[dev]"
      - name: Lint (ruff)
        run: ruff check pipeline scripts
      - name: Tests (pytest)
        run: python -m pytest pipeline/tests scripts/tests
