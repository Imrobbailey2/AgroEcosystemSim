name: Fetch sources

# Manually started. Downloads SSURGO soils, UF/IFAS budgets, FAWN weather,
# Florida statewide parcel values (aggregates only), USDA ERS corn cost lines
# and the county map extracts (parcel shapes with land-use code and area only,
# city limits, county outline), writes citable extracts plus a checksum lock,
# rebuilds the data pack, and pushes everything to a new data/fetch-<run id>
# branch for review as a PR. Copyrighted raw files (budget workbooks) are never
# committed; owner names, addresses and parcel IDs are never requested.

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region to fetch
        required: true
        default: suwannee
        type: choice
        options: [suwannee]
      only:
        description: "Steps to run. Leave EMPTY to run all. Or type any of: soils budgets weather parcels ers city_limits county_outline parcel_shapes (map = the last three)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-sources
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pipeline
        run: python -m pip install -e "./pipeline[dev]"
      - name: Resolve steps to run
        id: only
        env:
          ONLY_INPUT: ${{ inputs.only }}
        shell: bash
        run: |
          set -uo pipefail
          err="$(mktemp)"
          if ! picked="$(bash scripts/normalize-only.sh "$ONLY_INPUT" 2>"$err")"; then
            msg="$(head -n 1 "$err")"
            msg="${msg//'%'/'%25'}"
            echo "::error title=Invalid 'only' input::$msg"
            exit 2
          fi
          picked="$(echo $picked)"  # one line, space-separated
          echo "steps=$picked" >> "$GITHUB_OUTPUT"
          echo "Fetch steps: ${picked:-all (soils budgets weather parcels ers city_limits county_outline parcel_shapes)}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fetch and extract
        env:
          REGION: ${{ inputs.region }}
          ONLY: ${{ steps.only.outputs.steps }}
        shell: bash
        run: |
          set -uo pipefail
          args=(fetch --region "$REGION")
          if [ -n "$ONLY" ]; then
            read -r -a only_steps <<< "$ONLY"
            args+=(--only "${only_steps[@]}")
          fi
          bash scripts/annotate-errors.sh agroeco-pipeline "${args[@]}"
      - name: County map measurements
        env:
          REGION: ${{ inputs.region }}
        shell: bash
        run: |
          f="pipeline/sources/extracted/$REGION/map_measurements.json"
          if [ -f "$f" ]; then
            {
              echo "### County map measurements"
              echo ""
              echo '```json'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build and validate data pack
        env:
          REGION: ${{ inputs.region }}
        shell: bash
        run: bash scripts/annotate-errors.sh agroeco-pipeline build --region "$REGION"
      - name: Data guard
        run: python scripts/check_forbidden.py
      - name: Push data branch
        env:
          REGION: ${{ inputs.region }}
          BRANCH: data/fetch-${{ github.run_id }}
          BASE: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "pipeline/sources/extracted/$REGION" data/packs
          if git diff --cached --quiet; then
            echo "::notice::No changes from this fetch."
            exit 0
          fi
          git commit -m "data: fetch $REGION sources (run ${{ github.run_id }})"
          git push origin "$BRANCH"
          {
            echo "### Data branch pushed"
            echo ""
            echo "Open a pull request from \`$BRANCH\` into \`$BASE\` (the branch this run started from),"
            echo "then complete the spot-check for the increment."
          } >> "$GITHUB_STEP_SUMMARY"
