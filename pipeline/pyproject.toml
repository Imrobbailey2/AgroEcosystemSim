[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agroeco-pipeline"
version = "0.1.0"
description = "Data-pack pipeline for the Florida Agroecosystem Farm Simulator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rob Bailey" }]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agroeco-pipeline = "agroeco_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agroeco_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff settings live in the repository-root ruff.toml.
