[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agroeco-pipeline"
version = "0.0.1"
description = "Data-pack pipeline for the Florida Agroecosystem Farm Simulator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rob Bailey" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
agroeco-pipeline = "agroeco_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agroeco_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
